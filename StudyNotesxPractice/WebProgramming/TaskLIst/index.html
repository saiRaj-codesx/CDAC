<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="heading">Task List</div>

      <div class="controls">
        <button id="load-btn">Load Todos</button>
        <select id="filter-field">
          <option value="All">All</option>
          <option value="Completed">Completed</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <p id="message"></p>

      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="todo-body"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
